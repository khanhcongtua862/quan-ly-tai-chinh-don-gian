<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài chính</title>
</head>
<body>
    <h2>Quản lý tài chính</h2>
    <p>Tổng số dư: <strong id="balance">0 VND</strong></p>
    
    <input type="text" id="desc" placeholder="Mô tả giao dịch">
    <input type="number" id="amount" placeholder="Số tiền">
    <select id="type">
        <option value="income">Thu</option>
        <option value="expense">Chi</option>
    </select>
    <button onclick="addTransaction()">Thêm</button>

    <h3>Lịch sử giao dịch</h3>
    <input type="text" id="search" placeholder="Tìm kiếm giao dịch" oninput="filterTransactions()">
    <ul id="transactions"></ul>

    <!-- Nút xuất file -->
    <button onclick="exportToJson()">Xuất JSON</button>
    <button onclick="exportToCsv()">Xuất CSV</button>

    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        document.addEventListener('DOMContentLoaded', function () {
            updateUI(); // Load dữ liệu khi trang tải
        });

        function addTransaction() {
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            if (!desc || isNaN(amount)) return alert('Vui lòng nhập đầy đủ thông tin');

            transactions.push({ desc, amount, type });
            updateUI();
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';

            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        function updateUI() {
            const transactionList = document.getElementById('transactions');
            transactionList.innerHTML = ''; // Xóa danh sách cũ trước khi cập nhật

            transactions.forEach(transaction => {
                const li = document.createElement('li');
                li.textContent = `${transaction.desc} - ${transaction.amount} VND (${transaction.type === 'income' ? 'Thu' : 'Chi'})`;
                transactionList.appendChild(li);
            });

            // Cập nhật tổng số dư
            const balance = transactions.reduce((acc, transaction) => {
                return transaction.type === 'income' ? acc + transaction.amount : acc - transaction.amount;
            }, 0);
            document.getElementById('balance').textContent = balance + ' VND';

            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        function exportToJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "transactions.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
        }

        function exportToCsv() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Mô tả,Số tiền,Loại\n"; // Tiêu đề cột
            transactions.forEach(({ desc, amount, type }) => {
                csvContent += `${desc},${amount},${type === 'income' ? 'Thu' : 'Chi'}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", encodedUri);
            downloadAnchor.setAttribute("download", "transactions.csv");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
        }
    </script>
</body>
</html>
