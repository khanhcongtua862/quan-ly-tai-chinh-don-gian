<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài chính</title>
</head>
<body>
    <h2>Quản lý tài chính</h2>
    <p>Tổng số dư: <strong id="balance">0 VND</strong></p>
    
    <input type="text" id="desc" placeholder="Mô tả giao dịch">
    <input type="number" id="amount" placeholder="Số tiền">
    <select id="type">
        <option value="income">Thu</option>
        <option value="expense">Chi</option>
    </select>
    <button onclick="addTransaction()">Thêm</button>

    <h3>Lịch sử giao dịch</h3>
    <input type="text" id="search" placeholder="Tìm kiếm giao dịch" oninput="filterTransactions()">
    <ul id="transactions"></ul>

    <!-- Nút xuất file -->
    <button onclick="exportToJson()">Xuất JSON</button>
    <button onclick="exportToCsv()">Xuất CSV</button>
    <button onclick="clearAllTransactions()">Xóa lịch sử giao dịch</button>
    <script src="./js/script.js"></script>

</body>
</html>
